<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kullerkuss">
<meta name="theme-color" content="#fffaf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kullerkuss</title>
<style>
:root{--paper:#fffaf0;--ink:#3a3a5a;--blue:#4a90e2;--pink:#f06292}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Chalkboard SE","Comic Sans MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:absolute;inset:0;margin:auto;display:block}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,250,240,.88);flex-direction:column;gap:14px;text-align:center;padding:16px}
.ov.on{display:flex}#menu{justify-content:flex-start;overflow-y:auto}#menu>h1{margin-top:auto}#menu>.grid{margin-bottom:auto}
h1{margin:0;font-size:42px}h1 b{color:var(--blue)}h1 i{color:var(--pink);font-style:normal}
.grid{display:grid;grid-template-columns:repeat(5,56px);gap:10px}.grid h2{grid-column:1/-1;margin:6px 0 0;font-size:18px;text-align:left}
.lv{width:56px;height:56px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:inherit;font-size:24px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.lv small{font-size:11px;color:#e0a800;height:13px}
.lv:disabled{opacity:.35}
.btn{font:inherit;font-size:22px;padding:10px 22px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.stars{font-size:44px;color:#ffc107;letter-spacing:6px}
p{margin:0;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov on" id="menu"><h1><b>Kuller</b><i>kuss</i></h1><p>Male Linien, damit sich die zwei Kugeln treffen!</p><div class="grid" id="grid"></div></div>

  const f=Math.max(0,inkLeft)/L.ink;cx.lineCap='round';cx.lineWidth=8;
  cx.strokeStyle='#e8e0d0';cx.beginPath();cx.moveTo(130,61);cx.lineTo(280,61);cx.stroke();
  if(f>0){cx.strokeStyle=f<.2?'#e53935':COLS[lines%COLS.length];cx.beginPath();cx.moveTo(130,61);cx.lineTo(130+150*f,61);cx.stroke();}
  cx.font='15px sans-serif';cx.textAlign='left';cx.fillText('✏️',106,67);
  cx.font='28px sans-serif';cx.fillText('☰',12,42);cx.fillText('💡',W-88,42);
  if(still>180){const p=1+.15*Math.sin(performance.now()/150);cx.fillStyle='rgba(255,193,7,.45)';cx.beginPath();cx.arc(W-30,32,20*p,0,7);cx.fill();}
  cx.fillStyle='#3a3a5a';cx.fillText('↻',W-44,42);
  if(state==='lost'){cx.fillStyle='rgba(58,58,90,.85)';cx.fillRect(80,300,240,70);cx.fillStyle='#fff';cx.textAlign='center';cx.font='bold 22px '+FONT;cx.fillText('Oh nein! Nochmal ↻',W/2,342);}
  cx.textAlign='left';
}
// ---- Eingabe ----
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
cv.addEventListener('pointerdown',e=>{const p=pos(e);
  try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(_){}
  if(p.y<70){if(p.x<60)showMenu();else if(p.x>W-56)loadLevel(lvl);else if(p.x>W-100)hintT=180;return;}
  if(state==='lost'){loadLevel(lvl);return;}
  if(state!=='play'||inkLeft<=0||(L.maxl&&lines>=L.maxl))return;
  if(Query.point(Composite.allBodies(world),p).length||blocked(p,{x:p.x+.1,y:p.y}))return;
  cur=[p];cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!cur)return;const p=pos(e),l=cur[cur.length-1],d=Vector.magnitude(Vector.sub(p,l));
  if(d<3||inkLeft<=0||p.y<70)return;if(blocked(l,p))return;cur.push(p);inkLeft-=d;});
function endStroke(){if(!cur)return;const c=cur;cur=null;if(state==='play')addStroke(c);if(c.length===1)inkLeft-=10;}
cv.addEventListener('pointerup',endStroke);cv.addEventListener('pointercancel',endStroke);
// ---- Menü ----
const $=id=>document.getElementById(id);
function showMenu(){const g=$('grid');g.innerHTML='';
  LEVELS.forEach((_,i)=>{if(i%10===0){const h=document.createElement('h2');h.textContent='Welt '+(i/10+1);g.appendChild(h);}
    const b=document.createElement('button');b.className='lv';
    b.innerHTML=(i+1)+'<small>'+'★'.repeat(save[i]||0)+'</small>';b.disabled=i>0&&!save[i-1];
    b.onclick=()=>{$('menu').classList.remove('on');loadLevel(i);};g.appendChild(b);});
  $('menu').classList.add('on');}
$('wMenu').onclick=()=>{$('win').classList.remove('on');showMenu();};
$('wAgain').onclick=()=>{$('win').classList.remove('on');loadLevel(lvl);};
$('wNext').onclick=()=>{$('win').classList.remove('on');if(lvl+1<LEVELS.length)loadLevel(lvl+1);else showMenu();};
let last=0,acc=0;
function frame(t){
  if(!TEST){acc+=Math.min(100,t-(last||t));last=t;
    while(acc>=1000/120){step();acc-=1000/120;if(++tickN%2===0)tick();}}
  draw();requestAnimationFrame(frame);}
const TEST=location.search.includes('test');
resize();loadLevel(0);showMenu();requestAnimationFrame(frame);
if('serviceWorker'in navigator&&/^(https:|http:\/\/localhost)/.test(location.href))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
